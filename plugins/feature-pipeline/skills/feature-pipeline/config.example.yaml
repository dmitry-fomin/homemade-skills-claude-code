# Образец. Скопируй в корень проекта как .claude/feature-pipeline.yaml и правь там —
# файл внутри плагина перезапишется при обновлении, проектный переживёт его.
# Все пути — относительно корня проекта.

paths:
  specs: docs/specs             # крупные спеки функций; пусто — спек в проекте нет
  steps: docs/specs/steps       # ТЗ на шаг и порции, чек-листы, замечания, журналы
                                # (каталог шагов лежит внутри каталога спек — так и задумано)

second_opinion:
  when: always        # always | spec-only | off
  provider: grok      # имя из scripts/providers.conf скила /second-opinion:ask
  model: ""           # пусто — модель провайдера по умолчанию

executor:
  # Цепочка исполнителей этапа 3: сверху вниз до первого доступного.
  primary: grok:grok-delegate
  fallback: dsh:dsh-runner
  local: feature-pipeline:pipeline-implementer   # внутри Claude, доступен всегда
  on_fallback: auto   # auto — переехать и записать в журнал; ask — спросить автора
  effort: high        # low|medium|high|xhigh|max; только для grok — dsh и локальный игнорируют

cheap:
  # Только для /feature-pipeline:cheap-pipeline (ТЗ Opus, критика Gemini, код dsh, приёмка Sonnet).
  dsh_model: ""       # пусто — модель из настроек dsh; иначе pro | flash
  critic: gemini      # провайдер consult.sh для критики ТЗ

opus:
  # Только для /feature-pipeline:opus-pipeline (очередь задач трекера на Opus, коммитит исполнитель).
  # Команды выполняются из корня проекта; {id} подставляется id задачи.
  tracker:
    list: ""          # печатает очередь: по строке «<id> <заголовок>», в порядке выполнения
    show: ""          # печатает полный текст задачи {id} — его читает исполнитель, не оркестратор
    close: ""         # закрывает задачу {id} после проверенного коммита; пусто — не закрывать
  # Пример для beads (bd ready печатает таблицу, поэтому id и заголовок достаются из JSON;
  # сверь поля с выводом своей версии):
  #   list: bd ready --json | jq -r '.[] | "\(.id) \(.title)"'
  #   show: bd show {id}
  #   close: bd close {id}
