# Реестр движков image-gen. Все — OpenAI-совместимый /images/generations.
# Формат: алиас|base_url (без /images/generations)|переменная_с_ключом|модель|референс
#
# «референс» — принимает ли движок картинку-образец полем `image[]`:
#   yes — принимает и держит; no — не держит, --reference игнорируется
#   с предупреждением в stderr и reference_used: false в JSON.
#
# Порядок строк — это порядок фолбэка: при недоступности выбранного движка
# скил идёт вниз по списку. Первая строка — движок по умолчанию.
# Чтобы сменить модель, правь ровно одну строку здесь; скрипт трогать не нужно.
seed|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|bytedance-seed/seedream-5-0-pro|yes
qwen|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|qwen/qwen-image-3-pro|yes
gpt|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|gpt-image-2|no
