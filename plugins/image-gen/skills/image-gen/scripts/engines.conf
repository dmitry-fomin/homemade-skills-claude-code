# Реестр движков image-gen. Все — OpenAI-совместимый /images/*.
# Формат: алиас|base_url (без /images/...)|переменная_с_ключом|модель|референс
#
# «референс» — как движок принимает картинку-образец:
#   edits — multipart на /images/edits, файлы полем `image[]` (CloseRouter);
#   json  — data-url списком в поле `image` JSON-запроса на /images/generations;
#   no    — не держит, --reference игнорируется с предупреждением в stderr
#           и reference_used: false в JSON.
# Без --reference любой движок идёт JSON-ом на /images/generations.
#
# Порядок строк — это порядок фолбэка: при недоступности выбранного движка
# скил идёт вниз по списку.
#
# ПРАВИЛА ВЫБОРА ДВИЖКА (приоритет сверху вниз):
# 1. Если --reference НЕТ: a6 — gpt-image-2 у провайдера A6 (дешевле);
#    при его недоступности фолбэк на gpt — та же gpt-image-2, но у CloseRouter.
# 2. Если --reference передан: сразу gpt (CloseRouter) — A6 референс не держит,
#    а CloseRouter принимает его через /images/edits.
# 3. a6-25 (gpt-image-2.5 у A6) — только по явному флагу, в цепочку по умолчанию не входит.
# 4. Явные флаги (--gpt, --a6, --a6-25, --qwen) перекрывают умолчания.
#
# Чтобы сменить модель, правь ровно одну строку здесь; скрипт трогать не нужно.
# А вот новый движок требует своего флага: pick_chain() и build_parser() в скрипте.
a6-25|https://api.a6api.com/v1|A6_IMAGEGEN25_API_KEY|gpt-image-2.5|no
a6|https://api.a6api.com/v1|A6_IMAGEGEN_API_KEY|gpt-image-2|no
gpt|https://api.closerouter.dev/v1|CLOSEROUTER_SO_API_KEY|openai/gpt-image-2|edits
qwen|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|qwen/qwen-image-3-pro|json
