# Реестр провайдеров для second-opinion. Все — OpenAI-совместимый /chat/completions.
# Формат: имя|base_url (без /chat/completions)|переменная_с_токеном|модель_по_умолчанию
#
# Чтобы добавить нового провайдера — допиши строку в этом формате, менять
# consult.sh не нужно. Модель по умолчанию можно оставить пустой — тогда
# её обязательно указывать вторым аргументом consult.sh.
deepseek|https://api.deepseek.com/v1|DEEPSEEK_API_KEY|deepseek-v4-pro
gemini|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|google/gemini-3.7-flash
gptterra|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|openai/gpt-5.6-terra
gptsol|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|openai/gpt-5.6-sol-pro
qwen|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|qwen/qwen3.8-flash
openrouter|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|

# `grok` здесь нарочно нет: это не HTTP-провайдер, а локальный CLI плагина
# grok-build (свой ключ не нужен, авторизация — через /grok:login). Ветка
# для него зашита прямо в consult.sh, до чтения этого файла.
